<script>
$(document).ready(function() {
    $.ajax({
        type: 'get',
        url: 'https://ilcpb.ivs.hinet.net/public/ajaxGetStream',
        data: {
            'did' : '1145866305',
            'page': 'ilcpb',
        },
        dataType: 'json',
    }).done(function(json) {
        $('#auth_token').val(json.hls.authToken);
        $('#url_token').val(json.hls.urlToken);
        if (json.success) {
            _renderPlayer(json.data);
        } else {
            alert(json.message);
        }
    }).fail(function(jqXHR, textStatus) {
        alert('ajaxGetViewList Request failed:' + textStatus);
    });

    var myInterval = setInterval(_keepUrlAlive, 120*1000);
});

function _renderPlayer(data)
{
    $('#render-video').html('');

    var vjsPlayer = [];
    var opt = {
        controls: true,
        autoplay: true,
        preload: 'auto',
        muted: true,
        width: '950',
        // height: '360',
    };

    data.forEach(function(item, idx) {
        if (item.status == '1') {
            source = item.camurl;
            stype  = 'application/x-mpegURL';
        } else {
            source = 'https://ilcpb.ivs.hinet.net/public/media/no_signal.mp4';
            stype  = 'video/mp4';
        }
        $('#render-video').append('<video id="video-'+idx+'" class="video-js vjs-big-play-centered"></video><br>');
        vjsPlayer[idx] = videojs('video-'+idx, opt);
        vjsPlayer[idx].src({
            src: source,
            type: stype
        });

        if (idx == 0) {
            $('#first_source').val(source);
        }
    });

    vjsPlayer[0].on('pause', function() {
        console.log('pause!');
    });
    vjsPlayer[0].on('error', function() {
        console.log('error happen!');
        // 有問題一直 reload, browser 會爆炸
        // _doReload(vjsPlayer[0], $('#first_source').val());
    });

    // reload hls streaming url
    $('#reload').click(function(e) {
        _doReload(vjsPlayer[0], $('#first_source').val());
    });
}

function _doReload(player, source)
{
    player.src(source);
    player.play();
    console.log('reload done! ' + source);
}

function _keepUrlAlive()
{
    $.ajax({
        type: 'post',
        url: 'https://ilcpb.ivs.hinet.net/public/ajaxKeepStream',
        data: {
            'auth_token': $('#auth_token').val(),
            'url_token' : $('#url_token').val(),
        },
        dataType: "json",
    }).done(function(json) {
        if (json.success) {
            console.log('ajaxKeepStream done');
        } else {
            console.log('ajaxKeepStream error: ' + json.message);
        }
    }).fail(function(jqXHR, textStatus) {
        alert('ajaxKeepStream Request failed:' + textStatus);
    });
}

// 花蓮市公所HLS撥放頁面限制調閱時間
if ('ilcpb' == 'hualien') {
    const dateTime = new Date();
    const timestampNow = Math.floor(dateTime / 1000);
    const year  = dateTime.getFullYear();
    const month = dateTime.getMonth() + 1;
    const date  = dateTime.getDate();
    // console.log(dateTime);
    const start = new Date(year + '/' + month + '/' + date + ' 06:00:00');
    const timestampStart = Math.floor(start / 1000);
    // console.log(timestampStart);
    const end = new Date(year + '/' + month + '/' + date + ' 12:00:00');
    const timestampEnd = Math.floor(end / 1000);
    // console.log(timestampEnd);

    // 設定跳轉條件&頁面
    function Redirect() {
        window.location = 'https://ilcpb.ivs.hinet.net/public/hualien_live_cam'; //跳轉到攝影機列表頁面
    }
    if ((timestampNow < timestampStart) || (timestampNow > timestampEnd)) {
        alert("此影像播放頁面僅於每日06:00-12:00開放，謝謝!!");
        setTimeout('Redirect()', 0); //第二個參數是時間，單位毫秒
    } else {
        // console.log(timestampEnd - timestampNow);
        setTimeout('Redirect()', (timestampEnd - timestampNow)*1000); //第二個參數是時間，單位毫秒
    }

}

//智慧教保中心 HLS撥放頁面限制調閱時間
if ('ilcpb' === 'chtbaby') {
    if ('' !== '' && '' !== ''){
        const dateTime = new Date();
        const timestampNow = Math.floor(dateTime / 1000);
        const year  = dateTime.getFullYear();
        const month = dateTime.getMonth() + 1;
        const date  = dateTime.getDate();
        const start = new Date(year + '/' + month + '/' + date + ' ');
        const timestampStart = Math.floor(start / 1000);
        const end = new Date(year + '/' + month + '/' + date + ' ');
        const timestampEnd = Math.floor(end / 1000);

        // 設定跳轉條件&頁面
        function Redirect() {
            window.location = 'https://ilcpb.ivs.hinet.net/public/chtbaby_live_cam';
        }
        if ((timestampNow < timestampStart) || (timestampNow > timestampEnd)) {
            alert("此影像播放頁面僅於每日-開放，謝謝!!");
            setTimeout('Redirect()', 0);
        } else {
            console.log(timestampEnd - timestampNow);
            setTimeout('Redirect()', (timestampEnd - timestampNow)*1000); //第二個參數是時間，單位毫秒
        }
    }
    else{
        alert("找不到對應的使用者認證 或 使用者認證尚未設置開放時間!!");
        setTimeout('Redirect()', 0);
    }
}

</script>
